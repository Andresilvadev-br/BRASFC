<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>BRASFC · iniciando o jogo</title>
<style>
	html,body{margin:0;height:100%;background:#101418;color:#e7edf0;font:15px 'Segoe UI',system-ui,sans-serif}
	.bar{height:36px;-webkit-app-region:drag;display:flex;align-items:center;padding-left:14px;font-weight:800;letter-spacing:.06em;font-size:13px}
	.bar span{color:#10b981}
	main{height:calc(100% - 36px);display:grid;place-items:center;text-align:center}
	.box{max-width:420px;padding:24px}
	h1{font-size:22px;margin:0 0 10px}
	p{color:#aab6bd;line-height:1.5}
	button{margin-top:14px;padding:11px 22px;border-radius:999px;border:0;background:#10b981;color:#06140f;font-weight:700;font-size:15px;cursor:pointer}
	button:focus-visible{outline:2px solid #e8b86a;outline-offset:3px}
	button.alt{background:transparent;color:#e7edf0;box-shadow:inset 0 0 0 1px #3a4650;margin-left:8px}
	.hint{font-size:13px}
	.dot{width:10px;height:10px;border-radius:50%;background:#e8b86a;display:inline-block;margin-right:8px;animation:p 1.6s ease-in-out infinite}
	@keyframes p{50%{opacity:.3}}
	@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<div class="bar">BRAS<span>FC</span></div>
<main><div class="box">
	<h1><i class="dot"></i>O jogo não iniciou</h1>
	<p>O BRASFC roda inteiro no seu computador, sem internet. Algo impediu o jogo embutido de abrir.</p>
	<p id="d" class="hint"></p>
	<button id="r" autofocus>Tentar novamente</button>
	<p id="s" aria-live="polite"></p>
</div></main>
<script>
	const reason = new URLSearchParams(location.search).get('reason') || '';
	document.getElementById('d').textContent = reason === 'missing' ? 'Os arquivos do jogo não foram encontrados. Reinstale o BRASFC.' : reason && reason !== 'load' ? reason : 'Suas carreiras continuam salvas.';
	document.getElementById('r').addEventListener('click', () => { document.getElementById('s').textContent = 'Abrindo…'; window.brasfcDesktop.retry(); });
</script>
</body>
</html>
