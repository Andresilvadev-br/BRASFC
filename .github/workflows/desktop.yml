name: App Windows

# Gera o instalador do BRASFC para Windows e publica no GitHub Releases
# (só quando a versão do app em desktop/package.json ainda não foi publicada).
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'src/**', 'static/**', 'migrations/**', 'server/**', 'package*.json', 'vite.config.ts', '.github/workflows/desktop.yml']
  pull_request:
    branches: [dev, main, improvement/master-integration]
    paths: ['desktop/**', 'src/**', 'static/**', 'migrations/**', 'server/**', 'package*.json', 'vite.config.ts', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar no GitHub Releases (somente a partir da main)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Instalador Windows
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      release_pending: ${{ steps.ver.outputs.done == 'false' }}
      version: ${{ steps.ver.outputs.version }}
      release_exists: ${{ steps.ver.outputs.exists }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Verificar sintaxe do monitor no Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'update-recovery.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }
      # Jogo offline embutido: build de produção do jogo + servidor + dependências de execução.
      - name: Build do jogo (modo offline)
        working-directory: .
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node desktop/scripts/prepare-offline.mjs --install
      - run: npm ci --no-audit --no-fund
      - name: Autoteste da janela (centralização e tela cheia)
        shell: bash
        run: npx electron . --selftest
      - name: Instalador já publicado?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Só conta como publicado se a release tiver o instalador (uma release parcial é completada).
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx 'BRASFC-Setup.exe'; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Preparar versão para homologar o mesmo código sem republicar
        if: github.event_name != 'push' && steps.ver.outputs.done == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STABLE=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          node -e "const fs = require('node:fs'); const pkg = require('./package.json'); const version = process.argv[1].replace(/^v/, '').split('.').map(Number); version[2]++; pkg.version = version.join('.'); fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));" "$STABLE"
      - name: Gerar instalador
        if: github.event_name != 'push' || steps.ver.outputs.done != 'true'
        run: npx electron-builder --win --x64 --publish never
      - name: Gerar candidato com falhas controladas
        if: github.event_name != 'push' || steps.ver.outputs.done != 'true'
        shell: pwsh
        run: |
          $source = Get-Content main.js -Raw
          $package = Get-Content package.json -Raw
          try {
            $fault = @'
          {
            const fs = require('node:fs');
            const path = require('node:path');
            const directory = path.join(process.env.APPDATA, 'BRASFC');
            const marker = path.join(directory, 'update-validation-first-boot');
            if (fs.existsSync(marker)) {
              fs.unlinkSync(marker);
              fs.writeFileSync(path.join(directory, 'update-validation-fault'), 'first-boot');
              require('electron').app.exit(79);
            }
          }
          '@
            Set-Content main.js ($fault + [Environment]::NewLine + $source) -Encoding utf8
            node -e "const fs = require('node:fs'); const pkg = require('./package.json'); const version = pkg.version.split('.').map(Number); version[2]++; pkg.version = version.join('.'); fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao configurar a versão do candidato.' }
            npx electron-builder --win --x64 --publish never "-c.directories.output=dist-recovery" "-c.nsis.include=scripts/upgrade-faults.nsh"
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar o candidato para recuperação.' }
          } finally {
            Set-Content main.js $source -Encoding utf8
            Set-Content package.json $package -Encoding utf8
          }
      - name: Validar atualização interna com save anterior
        if: github.event_name != 'push' || steps.ver.outputs.done != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $old = Join-Path $env:RUNNER_TEMP 'brasfc-estavel'
          $stable = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq '.tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível identificar a versão estável.' }
          gh release download $stable --pattern BRASFC-Setup.exe --dir $old --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível obter o instalador $stable." }
          $process = Start-Process (Join-Path $old 'BRASFC-Setup.exe') -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Instalação anterior falhou: $($process.ExitCode)" }
          Stop-Process -Name BRASFC -ErrorAction SilentlyContinue
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Filter BRASFC.exe -Recurse | Select-Object -First 1
          if (!$exe) { throw 'O instalador não criou BRASFC.exe' }
          node scripts/verify-upgrade.mjs $exe.FullName dist (Join-Path $env:RUNNER_TEMP 'brasfc-upgrade.json') dist-recovery
      - name: Guardar evidências de atualização
        if: always() && (github.event_name != 'push' || steps.ver.outputs.done == 'false')
        uses: actions/upload-artifact@v4
        with:
          name: BRASFC-Windows-evidencias
          path: ${{ runner.temp }}/brasfc-upgrade.json
      - name: Guardar pacote de validação
        if: github.event_name != 'push' || steps.ver.outputs.done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BRASFC-Windows-candidato
          if-no-files-found: error
          path: |
            desktop/dist/BRASFC-Setup.exe
            desktop/dist/BRASFC-Setup.exe.blockmap
            desktop/dist/latest.yml
      - name: Instalador já publicado
        if: github.event_name == 'push' && steps.ver.outputs.done == 'true'
        run: echo "::notice::v${{ steps.ver.outputs.version }} já tem o instalador; aumente a versão em desktop/package.json para gerar outra."

  publish:
    name: Publicar instalador validado
    needs: windows
    if: github.ref == 'refs/heads/main' && needs.windows.outputs.release_pending == 'true' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BRASFC-Windows-candidato
          path: dist
      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.windows.outputs.version }}
          RELEASE_EXISTS: ${{ needs.windows.outputs.release_exists }}
        run: |
          assets=(dist/BRASFC-Setup.exe dist/BRASFC-Setup.exe.blockmap dist/latest.yml)
          if [ "$RELEASE_EXISTS" = true ]; then
            gh release upload "v$VERSION" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$VERSION" "${assets[@]}" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "BRASFC para Windows $VERSION" --notes "Instalador Windows x64 com modo offline, saves locais e atualização pelo aplicativo."
          fi
