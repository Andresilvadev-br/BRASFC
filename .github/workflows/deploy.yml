name: Deploy

# dev  → ambiente "staging"  (versões experimentais)
# main → ambiente "producao" (versões estáveis; proteja com aprovação em Settings → Environments)
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      publish:
        description: Autorizar publicação neste ambiente
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    name: Publicar imagem
    if: (github.ref_name == 'main' || github.ref_name == 'dev') && (github.event_name == 'push' || inputs.publish)
    needs: checks
    runs-on: ubuntu-latest
    # A VPS com self-update consegue instalar assim que a imagem estiver disponível.
    environment: ${{ github.ref_name == 'main' && 'producao' || 'staging' }}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ github.ref_name == 'main' && 'stable' || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Publicar na VPS
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'producao' || 'staging' }}
      url: ${{ vars.PUBLIC_URL }}
    env:
      ENV_NAME: ${{ github.ref_name == 'main' && 'producao' || 'staging' }}
      DEPLOY_METHOD: ${{ vars.DEPLOY_METHOD }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      HAS_VPS: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' && secrets.VPS_USER != '' && secrets.VPS_KNOWN_HOSTS != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolver método de implantação
        id: config
        run: |
          method="$DEPLOY_METHOD"
          if [ -z "$method" ]; then
            if [ "$HAS_VPS" = true ]; then method=ssh; else method=image-only; fi
          fi
          case "$method" in
            ssh)
              if [ "$HAS_VPS" != true ]; then
                echo "::error::Credenciais SSH da VPS incompletas."
                exit 1
              fi ;;
            self-update)
              if [ -z "$PUBLIC_URL" ]; then
                echo "::error::Configure PUBLIC_URL para verificar a atualização automática."
                exit 1
              fi ;;
            image-only)
              if [ "$ENV_NAME" = producao ]; then
                echo "::error::Imagem publicada. Configure a implantação de produção por SSH ou self-update."
                exit 1
              fi ;;
            *) echo "::error::DEPLOY_METHOD inválido."; exit 1 ;;
          esac
          if [ "$ENV_NAME" = producao ] && [ -z "$PUBLIC_URL" ]; then
            echo "::error::Configure PUBLIC_URL para confirmar a versão de produção."
            exit 1
          fi
          echo "method=$method" >> "$GITHUB_OUTPUT"
      - name: Preparar SSH
        if: steps.config.outputs.method == 'ssh'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Enviar arquivos de implantação
        if: steps.config.outputs.method == 'ssh'
        run: |
          DEST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          DIR="${{ vars.VPS_DIR || '/opt/brasfc' }}"
          ssh -i ~/.ssh/id_deploy "$DEST" "mkdir -p $DIR/deploy/caddy"
          scp -i ~/.ssh/id_deploy compose.yml "$DEST:$DIR/"
          scp -i ~/.ssh/id_deploy deploy/*.sh deploy/env.example "$DEST:$DIR/deploy/"
          scp -i ~/.ssh/id_deploy deploy/caddy/* "$DEST:$DIR/deploy/caddy/"
      - name: Implantar com verificação de saúde
        id: install
        if: steps.config.outputs.method == 'ssh'
        run: |
          DEST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          DIR="${{ vars.VPS_DIR || '/opt/brasfc' }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/id_deploy "$DEST" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh -i ~/.ssh/id_deploy "$DEST" "cd $DIR && chmod +x deploy/*.sh && deploy/deploy.sh $ENV_NAME ${{ needs.image.outputs.tag }}"
      - name: Conferir serviço e commit pela URL pública
        id: public
        if: steps.config.outputs.method != 'image-only' && vars.PUBLIC_URL != ''
        timeout-minutes: 12
        run: |
          expected="${GITHUB_SHA::12}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 8 "${PUBLIC_URL%/}/api/health" |
                jq -e --arg sha "$expected" '.status == "ok" and .db.ok == true and .commit == $sha' >/dev/null; then
              echo "Commit $expected saudável na URL pública."
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then sleep 12; fi
          done
          echo "::error::A URL pública não confirmou o commit $expected com banco saudável."
          exit 1
      - name: Registrar etapas verificadas
        if: always()
        env:
          METHOD: ${{ steps.config.outputs.method }}
          INSTALL: ${{ steps.install.outcome }}
          PUBLIC_CHECK: ${{ steps.public.outcome }}
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
        run: |
          {
            echo '### Publicação BRASFC'
            echo '- CI e build aprovados'
            echo "- Imagem publicada: $IMAGE_TAG"
            case "$METHOD:$INSTALL" in
              ssh:success) echo '- Instalação SSH concluída e serviço interno saudável';;
              ssh:failure) echo '- A etapa de instalação SSH falhou';;
              self-update:*) echo '- Instalação delegada ao atualizador da VPS';;
              *) echo '- Instalação sem confirmação';;
            esac
            if [ "$PUBLIC_CHECK" = success ]; then
              echo '- Serviço saudável e commit confirmado pela URL pública'
            else
              echo '- URL pública sem confirmação do commit'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
