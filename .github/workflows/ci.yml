name: CI

# Em PRs roda sozinho; em push para dev/main é chamado pelo workflow de Deploy.
on:
  pull_request:
    branches: [dev, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PostgreSQL real: a produção usa o driver `postgres`, que o PGlite dos testes não exercita.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brasfc
          POSTGRES_PASSWORD: brasfc
          POSTGRES_DB: brasfc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U brasfc" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verificação de tipos (svelte-check)
        run: npm run check
      - name: Testes automatizados (PGlite + PostgreSQL real)
        run: npm test
        env:
          PG_TEST_URL: postgres://brasfc:brasfc@127.0.0.1:5432/brasfc_test
      - name: Build de produção
        run: npm run build
        env:
          GIT_SHA: ${{ github.sha }}
      - name: Smoke test do servidor de produção (PGlite)
        run: |
          BRASFC_ALLOW_PGLITE=1 PGLITE_DIR=/tmp/brasfc-ci ORIGIN=http://127.0.0.1:3000 PORT=3000 node server/index.js &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health | tee /tmp/health.json | grep -q '"status":"ok"'; then
              cat /tmp/health.json; exit 0
            fi
            sleep 1
          done
          echo "servidor não respondeu"; exit 1

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
